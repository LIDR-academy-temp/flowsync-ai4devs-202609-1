services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - '54410:5432'
    environment:
      POSTGRES_USER: flowsync
      POSTGRES_PASSWORD: flowsync
      POSTGRES_DB: flowsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowsync -d flowsync']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  db-test:
    image: pgvector/pgvector:pg17
    ports:
      - '54411:5432'
    environment:
      POSTGRES_USER: flowsync
      POSTGRES_PASSWORD: flowsync
      POSTGRES_DB: flowsync_test
    # Efímera a propósito: sin volumen persistente; tmpfs = en memoria.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowsync -d flowsync_test']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  pgdata:
