name: Revisor Claude

# Revisa cada pull request con Claude Code y publica los hallazgos como
# comentarios en el propio PR. Pasos manuales y costes: docs/ci-revisor.md.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Sin permisos por defecto; el job pide solo los suyos.
permissions: {}

# Un push nuevo al mismo PR cancela la revisión en curso: no se paga por
# revisar un commit que ya no es la cabeza del PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: revisión
    # Un PR desde un fork no recibe los secretos del repositorio, así que no
    # podría autenticarse: se salta en vez de fallar en rojo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # leer el código del PR
      pull-requests: write # publicar los comentarios de revisión

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          # Credencial de suscripción (`claude setup-token`). Para usar una
          # clave de API de la consola, sustituye esta línea por
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Las dos entradas no son intercambiables: ver docs/ci-revisor.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # El token del propio workflow, acotado a los permisos del job. Evita
          # instalar la GitHub App de Claude y pedir `id-token: write`; los
          # comentarios salen como github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Publicar cada comentario en línea según se crea, igual con las dos
          # credenciales (la clasificación previa solo existe con clave de API).
          classify_inline_comments: false

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este pull request.

            1. Antes de nada, lee `REVIEW.md` en la raíz del repositorio con la
               herramienta Read. Es el archivo de calibración: dice qué cuenta
               como grave y cuántas sugerencias menores caben. Si no existe,
               dilo en el comentario de resumen y limítate a defectos de
               corrección y seguridad.
            2. Obtén el diff con `gh pr diff ${{ github.event.pull_request.number }}`
               y abre con Read, Grep y Glob los archivos que necesites para
               entender el contexto. `CLAUDE.md` describe la arquitectura.
            3. Publica cada hallazgo como comentario en línea sobre la línea
               afectada (mcp__github_inline_comment__create_inline_comment), y
               al final un único comentario de resumen con `gh pr comment`.
               Si no hay hallazgos, el resumen lo dice en una línea.

            No redirijas la salida de ningún comando a ficheros (nada de `>`,
            `>>` ni `tee`): lee la salida directamente del comando. No modifiques
            archivos ni hagas commits; esto es solo una revisión.

          claude_args: >-
            --model sonnet --effort medium --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
